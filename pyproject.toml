[project]
name = "quantum-llm-lab"
version = "0.2.0"
description = "Lab mínimo: visión MLX + LLM local + simulador cuántico (PennyLane) en Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pennylane>=0.38.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.18.0; sys_platform == 'darwin'",
  "mlx-lm>=0.19.0; sys_platform == 'darwin'",
  "mlx-vlm>=0.1.0; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
include = ["vision*"]
